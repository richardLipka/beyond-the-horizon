<?xml version="1.0" encoding="UTF-8"?>
<svg class="telescope-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" width="440" height="440"><style>:root {
  /* moře / sea */
  --deep-900: #062535;
  --deep-800: #0b3549;
  --deep-700: #124a63;
  --sea-600: #0f6d8c;
  --sea-500: #1f8fa8;
  --sea-400: #3fb0c4;
  --aqua-300: #7fd3e0;
  --aqua-200: #b7e8f1;
  --foam-100: #e4f6fa;
  --foam-50: #f2fbfd;

  /* pevnina a doplňky / land and accents */
  --paper: #ffffff;
  --sand: #f8eed6;
  --sun: #f2a93b;
  --coral: #e8695c;
  --coral-dark: #c2483d;
  --kelp: #2f9e6f;
  --kelp-dark: #1e7551;

  --ink: #0b2a3a;
  --muted: #5c7d8e;
  --line: rgba(11, 42, 58, 0.13);
  --line-soft: rgba(11, 42, 58, 0.07);

  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 999px;

  --shadow-sm: 0 2px 6px rgba(6, 37, 53, 0.07);
  --shadow: 0 10px 26px rgba(6, 37, 53, 0.1);
  --shadow-lg: 0 18px 44px rgba(6, 37, 53, 0.16);

  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-size: 17px;

  --gap: 18px;
  --gap-lg: 26px;
}
/* ==========================================================================
   diagram.css - vzhled SVG grafiky: bocni pohled, dalekohled, graf.
   Styling for the three SVG views. Barvy odpovidaji dlazdicim s cisly:
   coral = schovano, zelena = videt, morska modra = k obzoru.
   (c) 2026 Richard Lipka &lt;lipka@fav.zcu.cz&gt; - MIT license
   ========================================================================== */

/* --- spolecne / shared ---------------------------------------------------- */

.diagram-svg text,
.telescope-svg text,
.chart-svg text {
  font-family: var(--font);
  fill: var(--deep-800);
}

.dg-halo,
.ts-halo {
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

/* --- bocni pohled / side view -------------------------------------------- */

.dg-frame {
  fill: none;
  stroke: rgba(11, 42, 58, 0.18);
  stroke-width: 1.5;
}

/* Barvu tahu urcuje zvolene teleso, proto ji tady zamerne nenastavujeme. */
.dg-surface-line {
  stroke-width: 2.6;
  stroke-linecap: round;
}

.dg-decor path {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0.5;
}

.dg-decor-grass path {
  stroke-width: 1.8;
  opacity: 0.45;
}

.dg-decor-bands path {
  stroke-width: 3;
  opacity: 0.32;
}

.dg-decor-rocks path {
  stroke-width: 2.2;
  opacity: 0.42;
}

.dg-stars circle {
  fill: #fff;
  opacity: 0.85;
}

.dg-chord {
  stroke: rgba(11, 42, 58, 0.55);
  stroke-width: 1.8;
  stroke-dasharray: 7 6;
}

.dg-sight {
  stroke: #d2382a;
  stroke-width: 2.6;
  stroke-dasharray: 11 7;
  stroke-linecap: round;
}

.dg-pole {
  stroke: var(--deep-800);
  stroke-width: 2;
  stroke-dasharray: 4 4;
}

.dg-observer {
  fill: #10394f;
}

.dg-observer-body {
  fill: #1f8fa8;
}

.dg-eye {
  fill: #fff;
  stroke: #d2382a;
  stroke-width: 3;
}

.dg-horizon-dot {
  fill: var(--sun);
  stroke: #fff;
  stroke-width: 2.5;
}

.dg-horizon-tick {
  stroke: var(--sun);
  stroke-width: 2.4;
  stroke-dasharray: 5 4;
}

.dg-object-hidden {
  opacity: 0.28;
}

.dg-hidden-fill {
  opacity: 0.55;
}

.dg-hatch-line {
  stroke: var(--coral-dark);
  stroke-width: 2.4;
}

.dg-object-fallback {
  fill: #6f93a5;
  stroke: #38596b;
  stroke-width: 2;
}

/* kotovaci cary / dimension lines */

.dg-dim-line,
.dg-dim-tick {
  stroke: var(--deep-800);
  stroke-width: 2;
}

.dg-dim-label {
  font-size: 18px;
  font-weight: 700;
  fill: var(--deep-800);
}

.dg-dim-hidden .dg-dim-line,
.dg-dim-hidden .dg-dim-tick {
  stroke: var(--coral-dark);
}
.dg-dim-hidden .dg-dim-label {
  fill: var(--coral-dark);
}

.dg-dim-visible .dg-dim-line,
.dg-dim-visible .dg-dim-tick {
  stroke: var(--kelp-dark);
}
.dg-dim-visible .dg-dim-label {
  fill: var(--kelp-dark);
}

.dg-dim-eye .dg-dim-line,
.dg-dim-eye .dg-dim-tick {
  stroke: #10394f;
}

.dg-dim-bulge .dg-dim-line,
.dg-dim-bulge .dg-dim-tick {
  stroke: #06344a;
}

/* popisky / labels */

.dg-label {
  font-size: 18px;
  font-weight: 700;
  fill: var(--sun);
}

.dg-you {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.06em;
  fill: #10394f;
}

.dg-small {
  font-size: 15px;
  fill: var(--muted);
}

.dg-note {
  font-size: 15px;
  fill: var(--muted);
}

.dg-value {
  font-size: 20px;
  font-weight: 700;
  fill: var(--deep-800);
}

/* meritko a osy / ruler and axes */

.dg-axis-line,
.dg-axis-tick {
  stroke: rgba(11, 42, 58, 0.4);
  stroke-width: 1.6;
}

.dg-arrowhead {
  fill: var(--deep-800);
}

.dg-total-line {
  stroke: var(--deep-800);
  stroke-width: 2;
}

.dg-span-horizon .dg-dim-line,
.dg-span-horizon .dg-dim-tick {
  stroke: var(--sea-600);
  stroke-width: 3;
}
.dg-span-horizon .dg-dim-label {
  fill: var(--sea-600);
  font-size: 17px;
}

.dg-span-beyond .dg-dim-line,
.dg-span-beyond .dg-dim-tick {
  stroke: var(--sun);
  stroke-width: 3;
}
.dg-span-beyond .dg-dim-label {
  fill: #b57312;
  font-size: 17px;
}

.dg-scalebar-line {
  stroke: var(--deep-800);
  stroke-width: 2.2;
}

/* --- dalekohled / telescope ---------------------------------------------- */

.ts-rim {
  fill: none;
  stroke: var(--deep-800);
  stroke-width: 12;
  opacity: 0.9;
}

.ts-rim-inner {
  fill: none;
  stroke: rgba(255, 255, 255, 0.55);
  stroke-width: 3;
}

/* Barvy opet urcuje zvolene teleso. */
.ts-horizon {
  stroke-width: 3;
}

.ts-waves path {
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  opacity: 0.42;
}

.ts-stars circle {
  fill: #fff;
  opacity: 0.85;
}

.ts-ghost {
  opacity: 0.24;
}

.ts-ghost-box {
  fill: none;
  stroke: var(--coral-dark);
  stroke-width: 2.4;
  stroke-dasharray: 8 6;
}

.ts-fallback {
  fill: #6f93a5;
  stroke: #38596b;
  stroke-width: 2;
}

.ts-dim-line,
.ts-dim-tick {
  stroke: var(--kelp-dark);
  stroke-width: 2.4;
}

.ts-label {
  font-size: 20px;
  font-weight: 700;
  fill: var(--kelp-dark);
}

.ts-hidden-label {
  font-size: 17px;
  font-weight: 700;
  fill: rgba(255, 255, 255, 0.95);
}

.ts-empty {
  font-size: 19px;
  font-weight: 700;
  fill: var(--muted);
}

.ts-caption {
  font-size: 21px;
  font-weight: 800;
  fill: var(--deep-800);
}

.ts-subcaption {
  font-size: 15px;
  fill: var(--muted);
}

/* --- graf / chart --------------------------------------------------------- */

.ch-band-full {
  fill: rgba(47, 158, 111, 0.13);
}
.ch-band-partial {
  fill: rgba(242, 169, 59, 0.15);
}
.ch-band-hidden {
  fill: rgba(232, 105, 92, 0.15);
}

.ch-band-label {
  font-size: 15px;
  font-weight: 700;
  fill: var(--muted);
}

.ch-grid {
  stroke: rgba(11, 42, 58, 0.1);
  stroke-width: 1;
}

.ch-tick {
  font-size: 14px;
  fill: var(--muted);
}

.ch-area {
  fill: rgba(31, 143, 168, 0.22);
}

.ch-curve {
  stroke: var(--sea-600);
  stroke-width: 3.4;
  stroke-linejoin: round;
}

.ch-marker {
  stroke-width: 2.4;
  stroke-dasharray: 8 6;
}

.ch-marker-start {
  stroke: var(--kelp-dark);
}

.ch-marker-vanish {
  stroke: var(--coral-dark);
}

.ch-marker-label {
  font-size: 15px;
  font-weight: 700;
  fill: var(--deep-800);
}

.ch-now {
  stroke: var(--deep-800);
  stroke-width: 2;
}

.ch-now-dot {
  fill: #fff;
  stroke: var(--deep-800);
  stroke-width: 3;
}

.ch-frame {
  fill: none;
  stroke: rgba(11, 42, 58, 0.25);
  stroke-width: 1.5;
}

.ch-axis-title {
  font-size: 15px;
  font-weight: 600;
  fill: var(--muted);
}

/* --- meze viditelnosti / limits of sight ---------------------------------- */

.lm-dot {
  fill: var(--deep-700);
  stroke: #fff;
  stroke-width: 2;
}

.lm-dot-active {
  fill: var(--coral);
  stroke: #fff;
  stroke-width: 3;
}

.lm-dot-label {
  font-size: 14px;
  font-weight: 700;
  fill: var(--deep-800);
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

.dg-warn {
  font-size: 18px;
  font-weight: 800;
  fill: var(--coral-dark);
}

/* --- rezim Geometrie / the geometry construction -------------------------- */

.geometry-svg text {
  font-family: var(--font);
  fill: var(--deep-800);
}

.gm-body {
  stroke-width: 2;
}

.gm-radius {
  stroke: var(--deep-800);
  stroke-width: 2.4;
}

.gm-hypotenuse {
  stroke: var(--deep-800);
  stroke-width: 1.6;
  stroke-dasharray: 6 5;
  opacity: 0.75;
}

.gm-sight {
  stroke: #d2382a;
  stroke-width: 3;
  stroke-linecap: round;
}

.gm-right-angle {
  stroke: #d2382a;
  stroke-width: 2.2;
}

.gm-arc {
  stroke-width: 6;
  stroke-linecap: round;
}

.gm-arc-observer {
  stroke: var(--sea-500);
}

.gm-arc-object {
  stroke: var(--coral);
}

.gm-height {
  stroke-width: 5;
  stroke-linecap: round;
}

.gm-height-observer {
  stroke: var(--sea-600);
}

.gm-height-object {
  stroke: var(--coral-dark);
}

.gm-angle {
  stroke-width: 2.4;
  fill: none;
}

.gm-angle-observer {
  stroke: var(--sea-600);
}

.gm-angle-object {
  stroke: var(--coral-dark);
}

.gm-point {
  fill: var(--deep-900);
  stroke: #fff;
  stroke-width: 2;
}

.gm-point-small {
  stroke-width: 1.5;
}

.gm-symbol {
  font-size: 21px;
  font-weight: 700;
  font-style: italic;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.6px;
  stroke-linejoin: round;
}

.gm-symbol-small {
  font-size: 15px;
  font-weight: 700;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3px;
  stroke-linejoin: round;
}

.gm-label {
  font-size: 16px;
  font-weight: 700;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.6px;
  stroke-linejoin: round;
}

.gm-role {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

.gm-observer-fill {
  fill: var(--sea-600);
}

.gm-object-fill {
  fill: var(--coral-dark);
}

.gm-note {
  font-size: 14px;
  fill: var(--muted);
}
</style><defs><clipPath id="ts-clip-113"><circle cx="220" cy="210" r="176"/></clipPath><clipPath id="ts-above-116"><rect x="44" y="34" width="352" height="250"/></clipPath><linearGradient id="ts-sky-114" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9fd6ea"/><stop offset="70%" stop-color="#d7eef7"/><stop offset="100%" stop-color="#f2fafc"/></linearGradient><linearGradient id="ts-sea-115" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2e9fbd"/><stop offset="100%" stop-color="#0a3d5c"/></linearGradient></defs><g clip-path="url(#ts-clip-113)"><rect x="44" y="34" width="352" height="352" fill="url(#ts-sky-114)"/><rect x="44" y="284" width="352" height="102" fill="url(#ts-sea-115)"/><g class="ts-ghost"><image href="data:image/svg+xml;base64," x="88" y="256.17615781865845" width="264" height="73.33333333333333" preserveAspectRatio="none"/></g><rect x="88" y="284" width="264" height="45.509491151991746" class="ts-ghost-box"/><g clip-path="url(#ts-above-116)"><image href="data:image/svg+xml;base64," x="88" y="256.17615781865845" width="264" height="73.33333333333333" preserveAspectRatio="none"/></g><rect x="44" y="284" width="352" height="102" fill="url(#ts-sea-115)" opacity="0.88"/><line x1="44" y1="284" x2="396" y2="284" class="ts-horizon" stroke="#0a3d5c"/><g class="ts-waves" stroke="#ffffff"><path d="M 44 298 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0"/><path d="M 50 315 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0"/><path d="M 56 332 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0"/><path d="M 62 349 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0 q 16 6 32 0 q 16 -6 32 0"/><path d="M 68 366 q 16 -6 32 0 q 1