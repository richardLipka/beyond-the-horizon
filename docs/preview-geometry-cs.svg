<?xml version="1.0" encoding="UTF-8"?>
<svg class="geometry-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" width="900" height="560"><style>:root {
  /* moře / sea */
  --deep-900: #062535;
  --deep-800: #0b3549;
  --deep-700: #124a63;
  --sea-600: #0f6d8c;
  --sea-500: #1f8fa8;
  --sea-400: #3fb0c4;
  --aqua-300: #7fd3e0;
  --aqua-200: #b7e8f1;
  --foam-100: #e4f6fa;
  --foam-50: #f2fbfd;

  /* pevnina a doplňky / land and accents */
  --paper: #ffffff;
  --sand: #f8eed6;
  --sun: #f2a93b;
  --coral: #e8695c;
  --coral-dark: #c2483d;
  --kelp: #2f9e6f;
  --kelp-dark: #1e7551;

  --ink: #0b2a3a;
  --muted: #5c7d8e;
  --line: rgba(11, 42, 58, 0.13);
  --line-soft: rgba(11, 42, 58, 0.07);

  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 999px;

  --shadow-sm: 0 2px 6px rgba(6, 37, 53, 0.07);
  --shadow: 0 10px 26px rgba(6, 37, 53, 0.1);
  --shadow-lg: 0 18px 44px rgba(6, 37, 53, 0.16);

  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-size: 17px;

  --gap: 18px;
  --gap-lg: 26px;
}
/* ==========================================================================
   diagram.css - vzhled SVG grafiky: bocni pohled, dalekohled, graf.
   Styling for the three SVG views. Barvy odpovidaji dlazdicim s cisly:
   coral = schovano, zelena = videt, morska modra = k obzoru.
   (c) 2026 Richard Lipka &lt;lipka@fav.zcu.cz&gt; - MIT license
   ========================================================================== */

/* --- spolecne / shared ---------------------------------------------------- */

.diagram-svg text,
.telescope-svg text,
.chart-svg text {
  font-family: var(--font);
  fill: var(--deep-800);
}

.dg-halo,
.ts-halo {
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

/* --- bocni pohled / side view -------------------------------------------- */

.dg-frame {
  fill: none;
  stroke: rgba(11, 42, 58, 0.18);
  stroke-width: 1.5;
}

/* Barvu tahu urcuje zvolene teleso, proto ji tady zamerne nenastavujeme. */
.dg-surface-line {
  stroke-width: 2.6;
  stroke-linecap: round;
}

.dg-decor path {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0.5;
}

.dg-decor-grass path {
  stroke-width: 1.8;
  opacity: 0.45;
}

.dg-decor-bands path {
  stroke-width: 3;
  opacity: 0.32;
}

.dg-decor-rocks path {
  stroke-width: 2.2;
  opacity: 0.42;
}

.dg-stars circle {
  fill: #fff;
  opacity: 0.85;
}

.dg-chord {
  stroke: rgba(11, 42, 58, 0.55);
  stroke-width: 1.8;
  stroke-dasharray: 7 6;
}

.dg-sight {
  stroke: #d2382a;
  stroke-width: 2.6;
  stroke-dasharray: 11 7;
  stroke-linecap: round;
}

.dg-pole {
  stroke: var(--deep-800);
  stroke-width: 2;
  stroke-dasharray: 4 4;
}

.dg-observer {
  fill: #10394f;
}

.dg-observer-body {
  fill: #1f8fa8;
}

.dg-eye {
  fill: #fff;
  stroke: #d2382a;
  stroke-width: 3;
}

.dg-horizon-dot {
  fill: var(--sun);
  stroke: #fff;
  stroke-width: 2.5;
}

.dg-horizon-tick {
  stroke: var(--sun);
  stroke-width: 2.4;
  stroke-dasharray: 5 4;
}

.dg-object-hidden {
  opacity: 0.28;
}

.dg-hidden-fill {
  opacity: 0.55;
}

.dg-hatch-line {
  stroke: var(--coral-dark);
  stroke-width: 2.4;
}

.dg-object-fallback {
  fill: #6f93a5;
  stroke: #38596b;
  stroke-width: 2;
}

/* kotovaci cary / dimension lines */

.dg-dim-line,
.dg-dim-tick {
  stroke: var(--deep-800);
  stroke-width: 2;
}

.dg-dim-label {
  font-size: 18px;
  font-weight: 700;
  fill: var(--deep-800);
}

.dg-dim-hidden .dg-dim-line,
.dg-dim-hidden .dg-dim-tick {
  stroke: var(--coral-dark);
}
.dg-dim-hidden .dg-dim-label {
  fill: var(--coral-dark);
}

.dg-dim-visible .dg-dim-line,
.dg-dim-visible .dg-dim-tick {
  stroke: var(--kelp-dark);
}
.dg-dim-visible .dg-dim-label {
  fill: var(--kelp-dark);
}

.dg-dim-eye .dg-dim-line,
.dg-dim-eye .dg-dim-tick {
  stroke: #10394f;
}

.dg-dim-bulge .dg-dim-line,
.dg-dim-bulge .dg-dim-tick {
  stroke: #06344a;
}

/* popisky / labels */

.dg-label {
  font-size: 18px;
  font-weight: 700;
  fill: var(--sun);
}

.dg-you {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.06em;
  fill: #10394f;
}

.dg-small {
  font-size: 15px;
  fill: var(--muted);
}

.dg-note {
  font-size: 15px;
  fill: var(--muted);
}

.dg-value {
  font-size: 20px;
  font-weight: 700;
  fill: var(--deep-800);
}

/* meritko a osy / ruler and axes */

.dg-axis-line,
.dg-axis-tick {
  stroke: rgba(11, 42, 58, 0.4);
  stroke-width: 1.6;
}

.dg-arrowhead {
  fill: var(--deep-800);
}

.dg-total-line {
  stroke: var(--deep-800);
  stroke-width: 2;
}

.dg-span-horizon .dg-dim-line,
.dg-span-horizon .dg-dim-tick {
  stroke: var(--sea-600);
  stroke-width: 3;
}
.dg-span-horizon .dg-dim-label {
  fill: var(--sea-600);
  font-size: 17px;
}

.dg-span-beyond .dg-dim-line,
.dg-span-beyond .dg-dim-tick {
  stroke: var(--sun);
  stroke-width: 3;
}
.dg-span-beyond .dg-dim-label {
  fill: #b57312;
  font-size: 17px;
}

.dg-scalebar-line {
  stroke: var(--deep-800);
  stroke-width: 2.2;
}

/* --- dalekohled / telescope ---------------------------------------------- */

.ts-rim {
  fill: none;
  stroke: var(--deep-800);
  stroke-width: 12;
  opacity: 0.9;
}

.ts-rim-inner {
  fill: none;
  stroke: rgba(255, 255, 255, 0.55);
  stroke-width: 3;
}

/* Barvy opet urcuje zvolene teleso. */
.ts-horizon {
  stroke-width: 3;
}

.ts-waves path {
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  opacity: 0.42;
}

.ts-stars circle {
  fill: #fff;
  opacity: 0.85;
}

.ts-ghost {
  opacity: 0.24;
}

.ts-ghost-box {
  fill: none;
  stroke: var(--coral-dark);
  stroke-width: 2.4;
  stroke-dasharray: 8 6;
}

.ts-fallback {
  fill: #6f93a5;
  stroke: #38596b;
  stroke-width: 2;
}

.ts-dim-line,
.ts-dim-tick {
  stroke: var(--kelp-dark);
  stroke-width: 2.4;
}

.ts-label {
  font-size: 20px;
  font-weight: 700;
  fill: var(--kelp-dark);
}

.ts-hidden-label {
  font-size: 17px;
  font-weight: 700;
  fill: rgba(255, 255, 255, 0.95);
}

.ts-empty {
  font-size: 19px;
  font-weight: 700;
  fill: var(--muted);
}

.ts-caption {
  font-size: 21px;
  font-weight: 800;
  fill: var(--deep-800);
}

.ts-subcaption {
  font-size: 15px;
  fill: var(--muted);
}

/* --- graf / chart --------------------------------------------------------- */

.ch-band-full {
  fill: rgba(47, 158, 111, 0.13);
}
.ch-band-partial {
  fill: rgba(242, 169, 59, 0.15);
}
.ch-band-hidden {
  fill: rgba(232, 105, 92, 0.15);
}

.ch-band-label {
  font-size: 15px;
  font-weight: 700;
  fill: var(--muted);
}

.ch-grid {
  stroke: rgba(11, 42, 58, 0.1);
  stroke-width: 1;
}

.ch-tick {
  font-size: 14px;
  fill: var(--muted);
}

.ch-area {
  fill: rgba(31, 143, 168, 0.22);
}

.ch-curve {
  stroke: var(--sea-600);
  stroke-width: 3.4;
  stroke-linejoin: round;
}

.ch-marker {
  stroke-width: 2.4;
  stroke-dasharray: 8 6;
}

.ch-marker-start {
  stroke: var(--kelp-dark);
}

.ch-marker-vanish {
  stroke: var(--coral-dark);
}

.ch-marker-label {
  font-size: 15px;
  font-weight: 700;
  fill: var(--deep-800);
}

.ch-now {
  stroke: var(--deep-800);
  stroke-width: 2;
}

.ch-now-dot {
  fill: #fff;
  stroke: var(--deep-800);
  stroke-width: 3;
}

.ch-frame {
  fill: none;
  stroke: rgba(11, 42, 58, 0.25);
  stroke-width: 1.5;
}

.ch-axis-title {
  font-size: 15px;
  font-weight: 600;
  fill: var(--muted);
}

/* --- meze viditelnosti / limits of sight ---------------------------------- */

.lm-dot {
  fill: var(--deep-700);
  stroke: #fff;
  stroke-width: 2;
}

.lm-dot-active {
  fill: var(--coral);
  stroke: #fff;
  stroke-width: 3;
}

.lm-dot-label {
  font-size: 14px;
  font-weight: 700;
  fill: var(--deep-800);
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

.dg-warn {
  font-size: 18px;
  font-weight: 800;
  fill: var(--coral-dark);
}

/* --- rezim Geometrie / the geometry construction -------------------------- */

.geometry-svg text {
  font-family: var(--font);
  fill: var(--deep-800);
}

.gm-body {
  stroke-width: 2;
}

.gm-radius {
  stroke: var(--deep-800);
  stroke-width: 2.4;
}

.gm-hypotenuse {
  stroke: var(--deep-800);
  stroke-width: 1.6;
  stroke-dasharray: 6 5;
  opacity: 0.75;
}

.gm-sight {
  stroke: #d2382a;
  stroke-width: 3;
  stroke-linecap: round;
}

.gm-right-angle {
  stroke: #d2382a;
  stroke-width: 2.2;
}

.gm-arc {
  stroke-width: 6;
  stroke-linecap: round;
}

.gm-arc-observer {
  stroke: var(--sea-500);
}

.gm-arc-object {
  stroke: var(--coral);
}

.gm-height {
  stroke-width: 5;
  stroke-linecap: round;
}

.gm-height-observer {
  stroke: var(--sea-600);
}

.gm-height-object {
  stroke: var(--coral-dark);
}

.gm-angle {
  stroke-width: 2.4;
  fill: none;
}

.gm-angle-observer {
  stroke: var(--sea-600);
}

.gm-angle-object {
  stroke: var(--coral-dark);
}

.gm-point {
  fill: var(--deep-900);
  stroke: #fff;
  stroke-width: 2;
}

.gm-point-small {
  stroke-width: 1.5;
}

.gm-symbol {
  font-size: 21px;
  font-weight: 700;
  font-style: italic;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.6px;
  stroke-linejoin: round;
}

.gm-symbol-small {
  font-size: 15px;
  font-weight: 700;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3px;
  stroke-linejoin: round;
}

.gm-label {
  font-size: 16px;
  font-weight: 700;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.6px;
  stroke-linejoin: round;
}

.gm-role {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  paint-order: stroke fill;
  stroke: #fff;
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

.gm-observer-fill {
  fill: var(--sea-600);
}

.gm-object-fill {
  fill: var(--coral-dark);
}

.gm-note {
  font-size: 14px;
  fill: var(--muted);
}
</style><defs><linearGradient id="gm-body-29" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#79b276"/><stop offset="60%" stop-color="#3f7f56"/><stop offset="100%" stop-color="#245740"/></linearGradient></defs><circle cx="450" cy="452" r="236" fill="url(#gm-body-29)" stroke="#245740" class="gm-body"/><path d="M 419.41 217.99 A 236 236 0 0 1 450 216" class="gm-arc gm-arc-observer" fill="none"/><path d="M 450 216 A 236 236 0 0 1 605.61 274.57" class="gm-arc gm-arc-object" fill="none"/><line x1="450" y1="452" x2="450" y2="216" class="gm-radius"/><line x1="450" y1="452" x2="419.1459929509474" y2="216" class="gm-hypotenuse"/><line x1="450" y1="452" x2="656.9880243704608" y2="216" class="gm-hypotenuse"/><line x1="419.406342341752" y1="217.99139308331002" x2="419.1459929509474" y2="216" class="gm-height gm-height-observer"/><line x1="605.6147825852677" y1="274.57384792274877" x2="656.9880243704608" y2="216" class="gm-height gm-height-object"/><line x1="419.1459929509474" y1="216" x2="656.9880243704608" y2="216" class="gm-sight"/><path d="M 465 216 L 465 231 L 450 231" class="gm-right-angle" fill="none"/><text x="475" y="242" class="gm-symbol-small" text-anchor="start">90°</text><path d="M 440.41 378.62 A 74 74 0 0 1 450 378" class="gm-angle gm-angle-observer" fill="none"/><path d="M 450 378 A 74 74 0 0 1 498.79 396.37" class="gm-angle gm-angle-object" fill="none"/><text x="443.5045761165217" y="352.21117563286987" class="gm-symbol gm-observer-fill" text-anchor="middle">α</text><text x="485.227423327509" y="358.4103176322065" class="gm-symbol gm-object-fill" text-anchor="middle">β</text><circle cx="450" cy="452" r="4.5" class="gm-point"/><text x="450" y="476" class="gm-symbol" text-anchor="middle">O</text><circle cx="450" cy="216" r="4.5" class="gm-point"/><text x="438" y="204" class="gm-symbol" text-anchor="end">T</text><circle cx="419.1459929509474" cy="216" r="4.5" class="gm-point"/><text x="405.1459929509474" y="204" class="gm-symbol" text-anchor="end">A′</text><circle cx="656.9880243704608" cy="216" r="4.5" class="gm-point"/><text x="670.9880243704608" y="204" class="gm-symbol" text-anchor="start">B′</text><circle cx="419.406342341752" cy="217.99139308331002" r="3.5" class="gm-point gm-point-small"/><circle cx="605.6147825852677" cy="274.57384792274877" r="3.5" class="gm-point gm-point-small"/><text x="409.406342341752" y="237.99139308331002" class="gm-symbol-small" text-anchor="end">A</text><text x="615.6147825852677" y="294.57384792274877" class="gm-symbol-small" text-anchor="start">B</text><text x="438" y="334" class="gm-label" text-anchor="end">R = 6 371 km</text><text x="407.2761676463497" y="210.995696541655" class="gm-label gm-observer-fill" text-anchor="end">h₁ = 1,7 m</text><text x="643.3014034778643" y="239.28692396137438" class="gm-label gm-object-fill" text-anchor="start">h₂ = 330 m</text><text x="433.2418063806261" y="194.54483313280429" class="gm-label gm-observer-fill" text-anchor="middle">d₁ = 4,65 km</text><text x="540.8867521849731" y="210.53861949109282" class="gm-label gm-object-fill" text-anchor="middle">d₂ = 64,8 km</text><text x="434.5729964754737" y="202" class="gm-symbol gm-observer-fill" text-anchor="middle">t₁</text><text x="553.4940121852304" y="202" class="gm-symbol gm-object-fill" text-anchor="middle">t₂</text><text x="419.1459929509474" y="176" class="gm-label gm-observer-fill" text-anchor="middle">α = 0,0419°</text><text x="656.9880243704608" y="176" class="gm-label gm-object-fill" text-anchor="middle">β = 0,5832°</text><text x="419.1459929509474" y="242" class="gm-role gm-observer-fill" text-anchor="middle">pozorovatel</text><text x="656.9880243704608" y="242" class="gm-role gm-object-fill" text-anchor="middle">objekt</text><text x="450" y="548" class="gm-note" text-anchor="middle">Úhly v obrázku jsou zvětšené, jinak by nebyly vidět. Vypsaná čísla jsou skutečná.</text></svg>
